# === 字体 ===
font_family      Hack Nerd Font Mono
font_size         11.0
bold_font         Hack Nerd Font Mono Bold
italic_font       Hack Nerd Font Mono Italic
bold_italic_font  Hack Nerd Font Mono Bold Italic

# === Tokyo Night Storm 主题 ===
background            #24283b
foreground            #c0caf5
selection_foreground  #ffffff
selection_background  #ff5555
cursor                #c0caf5
cursor_text_color     #24283b
color0   #1d202f
color1   #f7768e
color2   #9ece6a
color3   #e0af68
color4   #7aa2f7
color5   #bb9af7
color6   #7dcfff
color7   #a9b1d6
color8   #414868
color9   #f7768e
color10  #9ece6a
color11  #e0af68
color12  #7aa2f7
color13  #bb9af7
color14  #7dcfff
color15  #c0caf5
active_tab_foreground    #24283b
active_tab_background    #7aa2f7
inactive_tab_foreground  #a9b1d6
inactive_tab_background  #1d202f

# === Shell ===
shell /home/randy/.cargo/bin/nu

# === 窗口 ===
confirm_os_window_close  0
hide_window_decorations  no



# ======== 追加升级 ========

# GPU 与 Wayland
linux_display_server wayland
sync_to_monitor no
repaint_delay 2

# 窗口内边距和透明度
window_padding_width 8
background_opacity 0.88

# 标签栏样式
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted

# 分屏 Vim 风格导航
map ctrl+h neighboring_window left
map ctrl+l neighboring_window right
map ctrl+k neighboring_window up
map ctrl+j neighboring_window down

# Hints 快速打开（自定义快捷键）
map ctrl+shift+e kitten hints

# 交互细节
scrollback_lines 10000
mouse_hide_wait 1.0
cursor_blink_interval 0

# 如果你希望完全无边框（Hyprland 需配合 noborder 规则）
# hide_window_decorations yes


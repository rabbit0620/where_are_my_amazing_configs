# Tokyo Night Storm themed lock screen
background {
    color = rgb(24283b)
}

input-field {
    size = 200, 50
    position = 0, -80
    halign = center
    valign = center
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgb(a9b1d6)
    inner_color = rgb(24283b)
    font_color = rgb(c0caf5)
    placeholder_text = Password
    fail_color = rgb(f7768e)
    fail_text = <i>$FAIL</i>
    fail_transition = 300
    fade_on_empty = false
}

label {
    text = $TIME
    position = 0, 200
    halign = center
    valign = center
    font_size = 64
    font_family = Hack Nerd Font Mono
    color = rgb(c0caf5)
}

label {
    text = cmd[update:1000] date +"%Y-%m-%d %A"
    position = 0, 260
    halign = center
    valign = center
    font_size = 18
    font_family = Hack Nerd Font Mono
    color = rgb(a9b1d6)
}

label {
    text = $LAYOUT - $USER
    position = 0, -20
    halign = center
    valign = center
    font_size = 14
    font_family = Hack Nerd Font Mono
    color = rgb(7aa2f7)
}
